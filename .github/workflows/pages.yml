name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html app.js projects.js layout-core.js editor.html editor.js style.css start.css editor.css portfolio-pages.css .nojekyll mist-train-concept.html _site/
          unzip -q assets.zip -d _site/
          if [ -f art-gallery.zip ]; then
            unzip -q art-gallery.zip -d _site/
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [ "$count" -eq 1 ]; then
                exit 0
              fi
            fi
            echo "Waiting for the Pages artifact ($attempt/12)."
            sleep 5
          done
          echo "::error::The Pages artifact is not ready for deployment."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
